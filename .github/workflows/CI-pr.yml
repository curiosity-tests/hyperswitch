        shopt -s nullglob
        mine=("${obs}/${prefix}"*)
        if [ ${#mine[@]} -eq 0 ]; then
          mine=("${obs}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-observables"*)
        fi
        if [ ${#mine[@]} -eq 0 ]; then
          echo "::error::no observables for run ${prefix} in ${obs} - instrumentation produced nothing"
          fail=1
        else
          echo "observables present: ${#mine[@]} file(s)"
          printf '  %s\n' "${mine[@]}"
        fi

        for f in "${mine[@]}"; do
          case "$f" in
            *.jsonl|*.json|*.combined)
              if ! jq --slurp "." "$f" > /dev/null 2>&1; then
                echo "::error::observables do not parse: $f"
                fail=1
              fi
              ;;
          esac
        done

        # Crash thresholds copied from check-run: a few null frames are noise, more than
        # five is a stack walk into nothing.
        for f in "${root}"/log/co-host*.log "${home}"/log/co-host*.log; do
          [ -f "$f" ] || continue
          echo "Asserting that there is no crash in $f"
          if [ "$(grep -c 'p 00000000' "$f" 2>/dev/null || echo 0)" -gt 5 ] \
            || [ "$(grep -E -c 'FATAL: Uncaught signal|Address not mapped at|RAX 0x.*RBX 0x' "$f" 2>/dev/null || echo 0)" -gt 1 ]; then
            echo "::error::crash signature in $f"
            grep -E 'FATAL: Uncaught signal|Address not mapped at' "$f" | head -5 || true
            fail=1
          fi
        done

        cores=("${root}"/coredump.* "${home}"/coredump.*)
        if [ ${#cores[@]} -gt 0 ]; then
          echo "::error::coredump present: ${cores[*]}"
          fail=1
        fi

        for f in "${root}"/runc.log "${root}"/runc.global.log \
                 "${home}"/runc.log "${home}"/runc.global.log; do
          [ -f "$f" ] || continue
          if grep -q '^E:' "$f"; then
            echo "::error::error in $f"
            grep '^E:' "$f" | head -5
            fail=1
          fi
        done

        if [ "$fail" -ne 0 ]; then
          echo "::error::instrumentation check FAILED"
          exit 1
        fi
        echo "instrumentation check passed"
  test:
    name: Run tests on stable toolchain
    runs-on: ${{ matrix.runner }}

    env:
      # Use `sccache` for caching compilation artifacts
      # RUSTC_WRAPPER: sccache
      RUSTFLAGS: "-D warnings"

    strategy:
      fail-fast: false
      matrix:
        runner:
        - ubuntu-latest

    steps:
      # See the formatting job: these predicates are null == null (TRUE) under
      # workflow_dispatch, which demanded the HYPERSWITCH_BOT app secrets and
      # armed the `git push` in `Check Cargo.lock changed`.
    - name: Generate a token
      if: ${{ github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name && github.repository == 'juspay/hyperswitch' }}
      id: generate_token
      uses: actions/create-github-app-token@v1
      with:
        app-id: ${{ secrets.HYPERSWITCH_BOT_APP_ID }}
        private-key: ${{ secrets.HYPERSWITCH_BOT_APP_PRIVATE_KEY }}

    - name: Checkout repository for fork
      if: ${{ (github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name) || github.repository != 'juspay/hyperswitch' }}
      uses: crashappsec/action-checkout@main
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
        observables_continue_on_error: false
        lfs: false
    - name: Checkout repository with token
      if: ${{ (github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name) && github.repository == 'juspay/hyperswitch' }}
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
        ref: ${{ github.event.pull_request.head.ref }}
        token: ${{ steps.generate_token.outputs.token }}

    - name: Install mold linker
      uses: rui314/setup-mold@v1
      if: ${{ runner.os == 'Linux' }}
      with:
        make-default: true

    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: stable 2 weeks ago
        components: clippy

    - name: Install Protoc
      uses: arduino/setup-protoc@v3
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Install rust cache
      uses: Swatinem/rust-cache@v2.9.1
      with:
        save-if: false

    - name: Install just
      uses: taiki-e/install-action@v2
      with:
        tool: just
        checksum: true

    - name: Run clippy (redis-rs backend)
      shell: bash
      env:
          # Upstream's own ubuntu-latest cells die here with `terminated by
          # signal 15` + "The runner has received a shutdown signal" right after
          # `Checking hsdev` (juspay/hyperswitch run 34109133454) - the box runs
          # out of memory and takes the runner service with it. Upstream's green
          # path is the self-hosted hyperswitch-runners cell, which a fork cannot
          # use, so cut rustc parallelism instead of cutting the work.
        CARGO_BUILD_JOBS: 2
      run: just clippy

    - name: Run clippy (fred backend)
      shell: bash
      env:
          # Upstream's own ubuntu-latest cells die here with `terminated by
          # signal 15` + "The runner has received a shutdown signal" right after
          # `Checking hsdev` (juspay/hyperswitch run 34109133454) - the box runs
          # out of memory and takes the runner service with it. Upstream's green
          # path is the self-hosted hyperswitch-runners cell, which a fork cannot
          # use, so cut rustc parallelism instead of cutting the work.
        CARGO_BUILD_JOBS: 2
      run: just clippy fred

    - name: Check Cargo.lock changed
      if: ${{ (github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name) && github.repository == 'juspay/hyperswitch' }}
      shell: bash
      run: |
        if ! git diff --quiet --exit-code -- Cargo.lock ; then
          git config --local user.name 'hyperswitch-bot[bot]'
          git config --local user.email '148525504+hyperswitch-bot[bot]@users.noreply.github.com'
          git add Cargo.lock
          git commit --message 'chore: update Cargo.lock'
          git push
        fi

    - name: Run cargo check
      shell: bash
      run: cargo check --features "release"

    - name: Check observables and crashes
      if: always() && env.CHALK_ON == 'true'
      shell: bash
      run: |
        set -uo pipefail
        root="${CURIOSITY_ROOT:-}"
        home="${CURIOSITY_HOME:-/mnt/curiosity}"
        obs="${home}/observables"
        fail=0

        echo "::group::curiosity layout"
        echo "CURIOSITY_ROOT=${root:-<unset>}"
        echo "CURIOSITY_HOME=${home}"
        ls -la "${obs}" 2>/dev/null || echo "no observables dir at ${obs}"
        echo "::endgroup::"

        # Observables for THIS run+attempt. The prefix matters: a stale file from an
        # earlier run on the same mount would otherwise pass.
        prefix="${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
        shopt -s nullglob
        mine=("${obs}/${prefix}"*)
        if [ ${#mine[@]} -eq 0 ]; then
          mine=("${obs}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-observables"*)
        fi
        if [ ${#mine[@]} -eq 0 ]; then
          echo "::error::no observables for run ${prefix} in ${obs} - instrumentation produced nothing"
          fail=1
        else
          echo "observables present: ${#mine[@]} file(s)"
          printf '  %s\n' "${mine[@]}"
        fi

        for f in "${mine[@]}"; do
          case "$f" in
            *.jsonl|*.json|*.combined)
              if ! jq --slurp "." "$f" > /dev/null 2>&1; then
                echo "::error::observables do not parse: $f"
                fail=1
              fi
              ;;
          esac
        done

        # Crash thresholds copied from check-run: a few null frames are noise, more than
        # five is a stack walk into nothing.
        for f in "${root}"/log/co-host*.log "${home}"/log/co-host*.log; do
          [ -f "$f" ] || continue
          echo "Asserting that there is no crash in $f"
          if [ "$(grep -c 'p 00000000' "$f" 2>/dev/null || echo 0)" -gt 5 ] \
            || [ "$(grep -E -c 'FATAL: Uncaught signal|Address not mapped at|RAX 0x.*RBX 0x' "$f" 2>/dev/null || echo 0)" -gt 1 ]; then
            echo "::error::crash signature in $f"
            grep -E 'FATAL: Uncaught signal|Address not mapped at' "$f" | head -5 || true
            fail=1
          fi
        done

        cores=("${root}"/coredump.* "${home}"/coredump.*)
        if [ ${#cores[@]} -gt 0 ]; then
          echo "::error::coredump present: ${cores[*]}"
          fail=1
        fi

        for f in "${root}"/runc.log "${root}"/runc.global.log \
                 "${home}"/runc.log "${home}"/runc.global.log; do
          [ -f "$f" ] || continue
          if grep -q '^E:' "$f"; then
            echo "::error::error in $f"
            grep '^E:' "$f" | head -5
            fail=1
          fi
        done

        if [ "$fail" -ne 0 ]; then
          echo "::error::instrumentation check FAILED"
          exit 1
        fi
        echo "instrumentation check passed"
  typos:
    name: Spell check
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: crashappsec/action-checkout@main
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
        observables_continue_on_error: false
        lfs: false
    - name: Spell check
        # Unpinned action: typos master has drifted well past this pinned commit
        # and now reports 484 hits repo-wide. This job has been red on
        # juspay/hyperswitch since 2026-06-30 (last green CI-pr run 28453062146;
        # e.g. run 34109133454 fails the same step). Kept running, not gating -
        # the sibling job pins v1.48.0 over the critical directories and passes.
      continue-on-error: true
      uses: crate-ci/typos@master

    - name: Check observables and crashes
